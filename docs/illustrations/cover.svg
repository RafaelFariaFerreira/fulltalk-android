<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="fulltalk dev for Android: code is cheap, show me the talk">
  <!-- README cover. Render with scripts/make-illustrations.py -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190F4D"/>
      <stop offset=".52" stop-color="#4B31D3"/>
      <stop offset="1" stop-color="#8A77F7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotfade" cx=".28" cy=".4" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".16"/>
    </pattern>
    <mask id="dotmask"><rect width="1280" height="640" fill="url(#dotfade)"/></mask>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".95"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="640" rx="32"/></clipPath>
    <clipPath id="screen"><rect x="940" y="50" width="250" height="540" rx="34"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B0630" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B0630" flood-opacity=".35"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .b { font-weight: 600; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <ellipse cx="1040" cy="150" rx="520" ry="380" fill="url(#glow)"/>
    <ellipse cx="160" cy="700" rx="460" ry="300" fill="url(#glow)" opacity=".55"/>
    <rect width="1280" height="640" fill="url(#dots)" mask="url(#dotmask)"/>

    <!-- brand -->
    <g transform="translate(80 64) scale(.40625)">
      <rect width="128" height="128" rx="30" fill="#fff"/>
      <g fill="#5B3FE4">
        <rect x="21.4" y="46.1" width="10.9" height="35.8" rx="5.45"/>
        <rect x="40.0" y="30.7" width="10.9" height="66.6" rx="5.45"/>
        <rect x="58.6" y="14.1" width="10.9" height="99.8" rx="5.45"/>
        <rect x="77.2" y="30.7" width="10.9" height="66.6" rx="5.45"/>
        <rect x="95.8" y="46.1" width="10.9" height="35.8" rx="5.45"/>
      </g>
    </g>
    <text x="148" y="100" font-size="29" letter-spacing="-.4"><tspan class="b" fill="#fff">fulltalk</tspan><tspan fill="#CFC7FF" dx="8">dev</tspan></text>
    <rect x="322" y="76" width="86" height="30" rx="15" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".3"/>
    <text x="365" y="96" font-size="14" fill="#fff" text-anchor="middle">Android</text>

    <!-- headline -->
    <text class="b" font-size="59" letter-spacing="-2" fill="#fff">
      <tspan x="78" y="228" fill-opacity=".72">code is cheap,</tspan>
      <tspan x="78" y="298">show me the talk.</tspan>
    </text>
    <text font-size="20.5" fill="#fff" fill-opacity=".82">
      <tspan x="80" y="350">A floating microphone for your phone. Tap it, speak,</tspan>
      <tspan x="80" y="381">and the text lands where you are typing.</tspan>
    </text>

    <!-- gestures -->
    <g transform="translate(80 426)">
      <rect y="5" width="84" height="54" rx="27" fill="#0B0630" fill-opacity=".38"/>
      <rect width="84" height="54" rx="27" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
      <text class="b" x="42" y="35" font-size="21" fill="#fff" text-anchor="middle">Tap</text>
      <text x="109" y="34" font-size="17.5" fill="#fff" fill-opacity=".7" text-anchor="middle">or</text>
      <rect x="134" y="5" width="98" height="54" rx="27" fill="#0B0630" fill-opacity=".38"/>
      <rect x="134" width="98" height="54" rx="27" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
      <text class="b" x="183" y="35" font-size="21" fill="#fff" text-anchor="middle">Hold</text>
      <text x="252" y="34" font-size="17.5" fill="#fff" fill-opacity=".78">the bubble to talk, in any app</text>
    </g>

    <!-- chips -->
    <g font-size="14.5" fill="#fff" transform="translate(80 530)">
      <rect width="138" height="36" rx="18" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".22"/>
      <text x="69" y="23" text-anchor="middle">100% on-device</text>
      <rect x="150" width="158" height="36" rx="18" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".22"/>
      <text x="229" y="23" text-anchor="middle">Offline after setup</text>
      <rect x="320" width="110" height="36" rx="18" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".22"/>
      <text x="375" y="23" text-anchor="middle">Android 8+</text>
    </g>

    <!-- voice waveform, flowing into the phone -->
    <g fill="url(#wave)" transform="translate(712 300)">
      <rect x="0"   y="-18" width="10" height="36"  rx="5"/>
      <rect x="20"  y="-40" width="10" height="80"  rx="5"/>
      <rect x="40"  y="-66" width="10" height="132" rx="5"/>
      <rect x="60"  y="-46" width="10" height="92"  rx="5"/>
      <rect x="80"  y="-88" width="10" height="176" rx="5"/>
      <rect x="100" y="-58" width="10" height="116" rx="5"/>
      <rect x="120" y="-30" width="10" height="60"  rx="5"/>
      <rect x="140" y="-74" width="10" height="148" rx="5"/>
      <rect x="160" y="-44" width="10" height="88"  rx="5"/>
      <rect x="180" y="-24" width="10" height="48"  rx="5"/>
    </g>

    <!-- phone -->
    <g filter="url(#shadow)">
      <rect x="930" y="40" width="270" height="560" rx="44" fill="#0F0B26"/>
    </g>
    <rect x="930.75" y="40.75" width="268.5" height="558.5" rx="43.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
    <g clip-path="url(#screen)">
      <rect x="940" y="50" width="250" height="540" fill="#F7F6FC"/>
      <!-- status bar -->
      <text class="b" x="962" y="78" font-size="12.5" fill="#1B1A2E">9:41</text>
      <rect x="1146" y="68" width="22" height="11" rx="3" fill="none" stroke="#1B1A2E" stroke-width="1.4"/>
      <rect x="1148.5" y="70.5" width="13" height="6" rx="1.5" fill="#1B1A2E"/>
      <!-- chat header -->
      <circle cx="972" cy="112" r="14" fill="#E6E1FC"/>
      <text class="b" x="972" y="116.5" font-size="12" fill="#5B3FE4" text-anchor="middle">A</text>
      <text class="b" x="996" y="117" font-size="15" fill="#1B1A2E">Ana</text>
      <rect x="940" y="136" width="250" height="1" fill="#E8E6F3"/>
      <!-- messages -->
      <rect x="956" y="156" width="150" height="38" rx="16" fill="#fff" stroke="#E8E6F3"/>
      <text x="972" y="180" font-size="13" fill="#1B1A2E">Você vem hoje?</text>
      <rect x="1030" y="204" width="144" height="38" rx="16" fill="#E9E5FD"/>
      <text x="1046" y="228" font-size="13" fill="#1B1A2E">Tô saindo agora</text>
      <rect x="956" y="252" width="132" height="38" rx="16" fill="#fff" stroke="#E8E6F3"/>
      <text x="972" y="276" font-size="13" fill="#1B1A2E">Que horas?</text>
      <!-- input with the dictated text -->
      <rect x="956" y="516" width="178" height="44" rx="22" fill="#fff" stroke="#E8E6F3"/>
      <rect x="970" y="527" width="146" height="22" rx="5" fill="#5B3FE4" fill-opacity=".16"/>
      <text x="974" y="543" font-size="13" fill="#1B1A2E">Chego em dez minutos</text>
      <rect x="1119" y="528" width="1.6" height="20" fill="#5B3FE4"/>
      <circle cx="1160" cy="538" r="20" fill="#5B3FE4"/>
      <path d="M1152 538h15M1160 531l7 7-7 7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1025" y="574" width="80" height="4" rx="2" fill="#1B1A2E" fill-opacity=".35"/>
    </g>

    <!-- the bubble, floating over the app -->
    <circle cx="1148" cy="372" r="42" fill="#5B3FE4" fill-opacity=".28"/>
    <g filter="url(#soft)"><circle cx="1148" cy="372" r="30" fill="#5B3FE4"/></g>
    <g transform="translate(1148 370)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <rect x="-5.5" y="-14" width="11" height="19" rx="5.5"/>
      <path d="M-10.5 0a10.5 10.5 0 0 0 21 0"/>
      <path d="M0 10.5v5.5"/>
    </g>
    <g filter="url(#soft)"><rect x="974" y="354" width="122" height="36" rx="13" fill="#1B1A2E"/></g>
    <text x="1035" y="377" font-size="13.5" fill="#fff" text-anchor="middle">Texto colado</text>
  </g>
</svg>
